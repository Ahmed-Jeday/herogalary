apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: heroverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: heroverse/shop:1.0
          # Local cluster: image is loaded with `minikube image load` / `kind load`.
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: MONGO_URI
              value: mongodb://shop-mongo:27017/heroverse_shop
            - name: JWT_PUBLIC_KEY_PATH
              value: /keys/public.pem
          envFrom:
            - configMapRef:
                name: app-config
          startupProbe:
            httpGet:
              path: /health
              port: 3003
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            periodSeconds: 10
          # Process-level liveness, independent from MongoDB.
          livenessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: jwt-keys
