apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: heroverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: heroverse/auth:1.0
          # Local cluster: image is loaded with `minikube image load` / `kind load`.
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: JWT_PRIVATE_KEY_PATH
              value: /keys/private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /keys/public.pem
          envFrom:
            - secretRef:
                name: db-secret
            - configMapRef:
                name: app-config
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 10
          # Process-level liveness, independent from PostgreSQL.
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: jwt-keys
