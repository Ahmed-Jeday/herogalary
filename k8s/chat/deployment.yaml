apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: heroverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: heroverse/chat:1.0
          # Local cluster: image is loaded with `minikube image load` / `kind load`.
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URI
              value: mongodb://chat-mongo:27017/heroverse_chat
            - name: JWT_PUBLIC_KEY_PATH
              value: /keys/public.pem
          envFrom:
            - configMapRef:
                name: app-config
          # /health reports the MongoDB state: use it for readiness only.
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness must not restart the pod when MongoDB is unavailable.
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: jwt-keys
