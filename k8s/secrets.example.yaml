apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: heroverse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_URL_SAFE_PASSWORD"
  DATABASE_URL: "postgresql://postgres:CHANGE_ME_URL_SAFE_PASSWORD@postgres:5432/heroverse_auth"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
  namespace: heroverse
type: Opaque
stringData:
  private.pem: |
    REPLACE_WITH_PRIVATE_PEM_CONTENT
  public.pem: |
    REPLACE_WITH_PUBLIC_PEM_CONTENT
