services:
  mongo:
    image: mongo:8
    container_name: heroverse-mongo
    environment:
      MONGO_INITDB_DATABASE: heroverse_shop
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/heroverse_shop | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  shop-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heroverse-shop
    environment:
      NODE_ENV: production
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/heroverse_shop
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_ISSUER: ${JWT_ISSUER:-heroverse-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-heroverse-services}
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
    ports:
      - "${SHOP_PORT:-3003}:3003"
    volumes:
      - ../auth-service/keys:/app/keys:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
